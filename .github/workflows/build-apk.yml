name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          unzip -q weatherglass-tv-*.zip
          cd weatherglass-tv-1.1.0
          cat > config.properties <<'EOF'
          tmdb_key=
          tmdb_region=BR
          latitude=-2.7956
          longitude=-40.5131
          city=Jijoca de Jericoacoara
          hide_animation=false
          language=pt
          show_crypto=false
          currency=BRL
          rates=USD,EUR
          temperature=C
          disable_assistant=false
          weather_wallpaper=true
          weather_motion=true
          prayer_times=false
          cctv_url=
          cctv_name=CCTV
          greeting_name=
          EOF
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          chmod +x build.sh
          ./build.sh
          cp FreeMyTV.apk ../WeatherglassTV.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" WeatherglassTV.apk --title "Weatherglass TV" --notes "APK gerado automaticamente"
